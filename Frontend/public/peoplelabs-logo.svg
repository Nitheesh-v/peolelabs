<svg xmlns="http://www.w3.org/2000/svg" viewBox="138 238 1366 292" role="img" aria-labelledby="title desc">
  <title id="title">PeopleLab Consulting Inc.</title>
  <desc id="desc">PeopleLab Consulting Inc. logo with a navy and green P mark, PEOPLE in navy, LAB in green, a red Canadian maple leaf, and CONSULTING INC. below.</desc>
  <defs>
    <linearGradient id="mark-navy" gradientUnits="userSpaceOnUse" x1="227" y1="285" x2="343" y2="401">
      <stop offset="0" stop-color="#122f63"/>
      <stop offset=".55" stop-color="#154a86"/>
      <stop offset="1" stop-color="#2273b8"/>
    </linearGradient>
    <linearGradient id="mark-green-side" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8dc63f"/>
      <stop offset=".55" stop-color="#7ab829"/>
      <stop offset="1" stop-color="#5e9a33"/>
    </linearGradient>
    <linearGradient id="mark-green-dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f6a1d"/>
      <stop offset="1" stop-color="#4d8a2a"/>
    </linearGradient>
    <linearGradient id="mark-green-base" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f6a1d"/>
      <stop offset=".5" stop-color="#4d8a2a"/>
      <stop offset="1" stop-color="#8fbf45"/>
    </linearGradient>
    <linearGradient id="rule" gradientUnits="userSpaceOnUse" x1="480" y1="0" x2="1382" y2="0">
      <stop offset="0" stop-color="#3f8f2c" stop-opacity="0"/>
      <stop offset=".08" stop-color="#3f8f2c"/>
      <stop offset=".92" stop-color="#3f8f2c"/>
      <stop offset="1" stop-color="#3f8f2c" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- P mark: open navy loop with a folded green ribbon stem -->
  <path fill="none" stroke="url(#mark-navy)" stroke-width="50" d="M227.2 285.3A82 82 0 1 1 342.7 400.8"/>
  <path fill="url(#mark-green-side)" d="M174 306 278 410 238 450 134 346Z"/>
  <path fill="url(#mark-green-dark)" d="M238 450 278 410 318 436 278 476Z"/>
  <path fill="url(#mark-green-side)" d="M278 476 318 436 392 456 352 496Z"/>

  <!-- PEOPLE -->
  <g fill="none" stroke="#0e2656" stroke-width="16" stroke-linejoin="round">
    <path id="letter-p" d="M436 423V321H505Q517 321 517 333V358Q517 370 505 370H444"/>
    <path id="letter-e" d="M637 321H563Q551 321 551 333V403Q551 415 563 415H637M551 368H629"/>
    <rect x="660" y="321" width="84" height="94" rx="12"/>
    <use href="#letter-p" transform="translate(339 0)"/>
    <path id="letter-l" d="M891 313V403Q891 415 903 415H968"/>
    <use href="#letter-e" transform="translate(442 0)"/>
  </g>

  <!-- LAB -->
  <g fill="none" stroke="#3f8f2c" stroke-width="16" stroke-linejoin="round">
    <use href="#letter-l" transform="translate(205 0)"/>
    <path d="M1190 423 1234 326Q1241 312 1248 326L1292 423"/>
    <path d="M1326 423V321H1386Q1398 321 1398 333V355Q1398 368 1386 368H1326M1386 368H1391Q1405 368 1405 381V403Q1405 415 1393 415H1326"/>
  </g>
  <circle cx="1241" cy="408" r="8.5" fill="#3f8f2c"/>

  <!-- Maple leaf -->
  <g transform="translate(1457 384) scale(.86)" fill="#d42027">
    <path d="m0-43 9 20 17-12-5 20 20 1-14 16 14 13-21 3 3 20-17-12-6 19-7-19-16 12 3-20-21-3 14-13-14-16 20-1-5-20 17 12z"/>
    <path d="M-2.5 34h5v28h-5z"/>
  </g>

  <path d="M480 461H1382" fill="none" stroke="url(#rule)" stroke-width="2.5"/>
  <text x="662" y="520" textLength="713" lengthAdjust="spacing" fill="#0e2656" font-family="'DIN Alternate', 'Segoe UI', Arial, Helvetica, sans-serif" font-size="50" font-weight="500">CONSULTING INC.</text>
</svg>
